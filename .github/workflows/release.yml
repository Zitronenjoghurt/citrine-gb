name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, for example v0.6.0
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            targets: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - name: linux-aarch64
            targets: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - name: macos
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            os: macos-latest
          - name: windows-x86_64
            targets: x86_64-pc-windows-msvc
            os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev \
            libx11-dev libxkbcommon-dev libwayland-dev

      - name: Build
        shell: bash
        env:
          TARGETS: ${{ matrix.targets }}
          # Matches LSMinimumSystemVersion in crates/citrine-gb-app/macos/Info.plist. Rust's
          # aarch64-apple-darwin is pinned to 11.0 anyway. This makes the
          # x86_64 slice of the universal binary agree with it.
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: |
          for target in ${TARGETS//,/ }; do
            cargo build --profile dist --locked -p citrine-gb-app --target "$target"
          done

      - name: Package
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"

          case "${{ matrix.name }}" in
            macos)
              # Universal .app in a drag-to-Applications disk image.
              ./scripts/bundle-macos.sh "$VERSION"
              ARCHIVE_FILE="citrine-${TAG}-macos.dmg"
              mv "target/macos/citrine-v${VERSION}-macos.dmg" "$ARCHIVE_FILE"
              ;;

            windows-*)
              ARCHIVE="citrine-${TAG}-${{ matrix.name }}"
              mkdir "$ARCHIVE"
              cp LICENSE CHANGELOG.md "$ARCHIVE"/
              cp "target/${{ matrix.targets }}/dist/citrine-gb-app.exe" "$ARCHIVE/citrine.exe"
              ARCHIVE_FILE="$ARCHIVE.zip"
              7z a "$ARCHIVE_FILE" "$ARCHIVE"
              ;;

            linux-*)
              ARCHIVE="citrine-${TAG}-${{ matrix.name }}"
              mkdir "$ARCHIVE"
              cp LICENSE CHANGELOG.md "$ARCHIVE"/
              cp "target/${{ matrix.targets }}/dist/citrine-gb-app" "$ARCHIVE/citrine"
              cp crates/citrine-gb-app/linux/citrine.desktop "$ARCHIVE"/
              cp crates/citrine-gb-app/linux/install.sh "$ARCHIVE"/
              cp crates/citrine-gb-app/assets/icon-256x256.png "$ARCHIVE/citrine.png"
              chmod +x "$ARCHIVE/citrine" "$ARCHIVE/install.sh"
              ARCHIVE_FILE="$ARCHIVE.tar.gz"
              tar czf "$ARCHIVE_FILE" "$ARCHIVE"
              ;;
          esac

          echo "ARCHIVE_FILE=$ARCHIVE_FILE" >> "$GITHUB_ENV"

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ env.ARCHIVE_FILE }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ARCHIVE_FILE }}

  android:
    runs-on: ubuntu-latest

    env:
      SIGNED: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.1.0" "ndk;29.0.14206865"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Write release key
        if: env.SIGNED == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "CITRINE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build
        working-directory: android
        env:
          CITRINE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CITRINE_KEY_ALIAS: citrine
          CITRINE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Package
        if: env.SIGNED == 'true'
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          APK_FILE="citrine-${TAG}-android.apk"
          mv android/app/build/outputs/apk/release/app-release.apk "$APK_FILE"
          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"

      - name: Skip unsigned upload
        if: env.SIGNED != 'true'
        run: |
          ls -l android/app/build/outputs/apk/release/
          echo "The ANDROID_KEYSTORE secrets are not set, so the APK is unsigned and stays off the release." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/attest-build-provenance@v4
        if: env.SIGNED == 'true'
        with:
          subject-path: ${{ env.APK_FILE }}

      - uses: actions/upload-artifact@v7
        if: env.SIGNED == 'true'
        with:
          name: android
          path: ${{ env.APK_FILE }}

      - uses: actions/upload-artifact@v7
        if: env.SIGNED == 'true'
        with:
          name: android-mapping
          path: android/app/build/outputs/mapping/release/mapping.txt

  release:
    needs: [build, android]
    runs-on: ubuntu-latest

    env:
      SIGN_UPDATES: ${{ secrets.UPDATE_SIGNING_KEY != '' }}

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: '!android-mapping'
          merge-multiple: true

      - name: Generate checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt

      - name: Sign checksums
        if: env.SIGN_UPDATES == 'true'
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$RUNNER_TEMP/update.key"
          minisign -S -s "$RUNNER_TEMP/update.key" -m dist/SHA256SUMS.txt -t "citrine $TAG"
          rm "$RUNNER_TEMP/update.key"

      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*
          body: |
            The web version is at [gb.lemon.industries](https://gb.lemon.industries).

            **macOS.** Download the `.dmg` and drag Citrine to Applications. One universal build covers Apple Silicon and Intel.
            Citrine is not signed with an Apple Developer ID, so macOS blocks the first launch. Open **System Settings → Privacy & Security**, scroll to the message about Citrine, and click **Open Anyway**. You only need to do this once.

            **Windows.** Download the `.zip`, extract it, and run `citrine.exe`. SmartScreen may warn because the binary is not code-signed. Verify the checksum below, then choose "More info" → "Run anyway".

            **Android.** Download the `.apk` on your phone and open it. Android asks once to allow installs from your browser or file manager. Android 8 or newer, 64-bit ARM.

            **Linux.** Download the `.tar.gz` for your architecture and extract it. Run `./install.sh` to add Citrine to your applications menu, or run `./citrine` directly.

            **Verify downloads.** Run `sha256sum -c SHA256SUMS.txt --ignore-missing`, or check any file's build provenance with `gh attestation verify <file> --repo ${{ github.repository }}`.
