name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, for example v0.6.0
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            targets: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - name: linux-aarch64
            targets: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - name: macos
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            os: macos-latest
          - name: windows-x86_64
            targets: x86_64-pc-windows-msvc
            os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev \
            libx11-dev libxkbcommon-dev libwayland-dev

      - name: Build
        shell: bash
        env:
          TARGETS: ${{ matrix.targets }}
          # Matches LSMinimumSystemVersion in app/macos/Info.plist. Rust's
          # aarch64-apple-darwin is pinned to 11.0 anyway. This makes the
          # x86_64 slice of the universal binary agree with it.
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: |
          for target in ${TARGETS//,/ }; do
            cargo build --profile dist --locked -p citrine-gb-app --target "$target"
          done

      - name: Package
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"

          case "${{ matrix.name }}" in
            macos)
              # Universal .app in a drag-to-Applications disk image.
              ./scripts/bundle-macos.sh "$VERSION"
              ARCHIVE_FILE="citrine-${TAG}-macos.dmg"
              mv "target/macos/citrine-v${VERSION}-macos.dmg" "$ARCHIVE_FILE"
              ;;

            windows-*)
              ARCHIVE="citrine-${TAG}-${{ matrix.name }}"
              mkdir "$ARCHIVE"
              cp LICENSE CHANGELOG.md "$ARCHIVE"/
              cp "target/${{ matrix.targets }}/dist/citrine-gb-app.exe" "$ARCHIVE/citrine.exe"
              ARCHIVE_FILE="$ARCHIVE.zip"
              7z a "$ARCHIVE_FILE" "$ARCHIVE"
              ;;

            linux-*)
              ARCHIVE="citrine-${TAG}-${{ matrix.name }}"
              mkdir "$ARCHIVE"
              cp LICENSE CHANGELOG.md "$ARCHIVE"/
              cp "target/${{ matrix.targets }}/dist/citrine-gb-app" "$ARCHIVE/citrine"
              cp app/linux/citrine.desktop "$ARCHIVE"/
              cp app/linux/install.sh "$ARCHIVE"/
              cp app/assets/icon-256x256.png "$ARCHIVE/citrine.png"
              chmod +x "$ARCHIVE/citrine" "$ARCHIVE/install.sh"
              ARCHIVE_FILE="$ARCHIVE.tar.gz"
              tar czf "$ARCHIVE_FILE" "$ARCHIVE"
              ;;
          esac

          echo "ARCHIVE_FILE=$ARCHIVE_FILE" >> "$GITHUB_ENV"

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ env.ARCHIVE_FILE }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ARCHIVE_FILE }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*
          body: |
            The web version is at [gb.lemon.industries](https://gb.lemon.industries).

            **macOS** — download the `.dmg` and drag Citrine to Applications. One universal build covers both Apple Silicon and Intel.
            Citrine is not signed with an Apple Developer ID, so the first launch is blocked. Open **System Settings → Privacy & Security**, scroll to the message about Citrine, and click **Open Anyway**. You only need to do this once.

            **Windows** — download the `.zip`, extract it, and run `citrine.exe`. SmartScreen may warn because the binary is not code-signed. Verify the checksum below, then choose "More info" → "Run anyway".

            **Linux** — download the `.tar.gz` for your architecture and extract it. Run `./install.sh` to add Citrine to your applications menu, or just run `./citrine` directly.

            **Verify downloads:** `sha256sum -c SHA256SUMS.txt --ignore-missing`, or check any file's build provenance with `gh attestation verify <file> --repo ${{ github.repository }}`.
