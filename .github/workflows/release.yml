name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, for example v0.6.0
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev \
            libx11-dev libxkbcommon-dev libwayland-dev

      - name: Build
        run: cargo build --release -p citrine-gb-app --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          VERSION="${{ inputs.tag || github.ref_name }}"
          ARCHIVE="citrine-${VERSION}-${{ matrix.target }}"
          mkdir "$ARCHIVE"
          cp LICENSE README.md CHANGELOG.md "$ARCHIVE"/
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/citrine-gb-app.exe" "$ARCHIVE/citrine.exe"
            7z a "$ARCHIVE.zip" "$ARCHIVE"
            echo "ARCHIVE_FILE=$ARCHIVE.zip" >> "$GITHUB_ENV"
          else
            cp "target/${{ matrix.target }}/release/citrine-gb-app" "$ARCHIVE/citrine"
            tar czf "$ARCHIVE.tar.gz" "$ARCHIVE"
            echo "ARCHIVE_FILE=$ARCHIVE.tar.gz" >> "$GITHUB_ENV"
          fi

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ env.ARCHIVE_FILE }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ARCHIVE_FILE }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*
          body: |
            Download the archive for your platform, extract it, and run `citrine` (`citrine.exe` on Windows).

            The web version is at [gb.lemon.industries](https://gb.lemon.industries).

            **macOS:** the binary is not code-signed, and browser downloads are quarantined by Gatekeeper. Run it once, then allow it under System Settings → Privacy & Security → "Open Anyway". Alternatively clear the flag after extracting (`xattr -d com.apple.quarantine citrine`) or download with `curl -LO <url>` in the first place.

            **Windows:** SmartScreen may warn because the binary is not code-signed. Verify the checksum below, then choose "More info" → "Run anyway".

            **Verify downloads:** `sha256sum -c SHA256SUMS.txt --ignore-missing`, or check any file's build provenance with `gh attestation verify <file> --repo ${{ github.repository }}`.
