[package]
name = "citrine-gb-websocket"
description = "WebSocket client for the Citrine app: no Nagle delay and no read wait in front of a send on native, ewebsock on the web."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tungstenite = { version = "0.24.0", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ewebsock = "0.8.0"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tungstenite = "0.24.0"
