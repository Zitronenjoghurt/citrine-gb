services:
  citrine-server:
    container_name: citrine-server
    build:
      context: ../../..
      dockerfile: crates/citrine-gb-server/docker/Dockerfile
    env_file:
      - path: .env
        required: false
    ports:
      - "${CITRINE_PORT:-13707}:${CITRINE_PORT:-13707}"
    volumes:
      - citrine-data:/citrine/data
    restart: unless-stopped

volumes:
  citrine-data:
