[package]
name = "citrine-gb-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
argon2 = "0.6.0"
axum = { version = "0.8.8", features = ["ws"] }
base64 = "0.22.1"
citrine-gb-gameinfo = { workspace = true, features = ["nds"] }
citrine-gb-net = { workspace = true }
citrine-gb-pkm = { workspace = true }
citrine-gb-surface = { workspace = true }
crc32fast = "1.5.0"
dotenvy = "0.15.7"
env_logger = "0.11.9"
fs4 = "0.13.1"
futures-util = { version = "0.3.31", default-features = false, features = ["sink", "std"] }
getrandom = "0.2.17"
log = "0.4.29"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
ring = "0.17.14"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha1 = "0.10.6"
sha2 = "0.10.9"
sqlx = { version = "0.9.0", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite-bundled"] }
subtle = "2.6.1"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
totp-rs = { version = "6.0.0", default-features = false, features = ["std", "otpauth"] }
tower-http = { version = "0.6.8", features = ["fs"] }
zstd = { version = "0.14.0", default-features = false }

[dev-dependencies]
rand = "0.8.5"
rsa = { version = "0.9.8", features = ["sha2"] }
citrine-gb-websocket = { workspace = true }
tempfile = "3.23.0"
tokio-tungstenite = "0.28.0"
