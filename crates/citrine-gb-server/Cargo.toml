[package]
name = "citrine-gb-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
argon2 = "0.6.0"
axum = { version = "0.8.8", features = ["ws"] }
citrine-gb-net = { workspace = true }
dotenvy = "0.15.7"
env_logger = "0.11.9"
fs4 = "0.13.1"
futures-util = { version = "0.3.31", default-features = false, features = ["sink", "std"] }
getrandom = "0.2.17"
log = "0.4.29"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
sqlx = { version = "0.9.0", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite-bundled"] }
subtle = "2.6.1"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
totp-rs = { version = "6.0.0", default-features = false, features = ["std", "otpauth"] }
tower-http = { version = "0.6.8", features = ["fs"] }

[dev-dependencies]
reqwest = { version = "0.12.24", default-features = false }
tempfile = "3.23.0"
tokio-tungstenite = "0.28.0"
