[package]
name = "citrine-gb-gameinfo"
description = "Names Game Boy, Game Boy Advance and Nintendo DS games from their ROM, and finds their libretro cover art."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false

[features]
nds = []

[dependencies]
brotli = "8.0.2"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
serde = { version = "1.0.228", features = ["derive"] }

[build-dependencies]
brotli = "8.0.2"
quote = "1.0.44"
