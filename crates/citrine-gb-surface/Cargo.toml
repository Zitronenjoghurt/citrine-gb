[package]
name = "citrine-gb-surface"
description = "Views a running game publishes to second screens, and the input they send back."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false

[dependencies]
citrine-gb-net = { workspace = true }
citrine-gb-threads = { workspace = true }
getrandom = "0.2.17"
hmac = "0.12.1"
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-encode", "safe-decode"] }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.10.9"
spake2 = "0.4.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2.17", features = ["js"] }

[dev-dependencies]
snow = { version = "0.10.0", default-features = false, features = ["use-blake2", "use-chacha20poly1305", "use-curve25519"] }
rand_core = "0.6.4"
