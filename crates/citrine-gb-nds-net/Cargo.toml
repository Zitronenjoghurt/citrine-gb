[package]
name = "citrine-gb-nds-net"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
citrine-gb = { workspace = true, features = ["nds"] }
base64 = "0.22.1"
citrine-gb-threads = { workspace = true }
md-5 = "0.11.0"
smoltcp = { version = "0.14.0", default-features = false, features = [
    "std",
    "medium-ethernet",
    "proto-ipv4",
    "proto-dhcpv4",
    "socket-udp",
    "socket-tcp",
] }

[dev-dependencies]
smoltcp = { version = "0.14.0", default-features = false, features = [
    "std",
    "medium-ethernet",
    "proto-ipv4",
    "proto-dhcpv4",
    "proto-dns",
    "socket-udp",
    "socket-tcp",
    "socket-dhcpv4",
    "socket-dns",
] }
