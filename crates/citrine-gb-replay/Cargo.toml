[package]
name = "citrine-gb-replay"
description = "Replays: the tape behind rewind, recordings, clips and bug reports, and the replay file."
version = "0.0.0"
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false

[features]
gba = ["citrine-gb/gba"]
nds = ["gba", "citrine-gb/nds"]

[dependencies]
citrine-gb = { workspace = true, features = ["persistence", "rom-id"] }
flate2 = "1"
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-encode", "safe-decode"] }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
zip = { version = "9.1.0", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
brotli = "8.0.2"
citrine-gb-test-roms = { workspace = true }
