[adjustris]
title = "Adjustris"
author = "Dave VanEe"
description = "Adjustris is an open source tetris-like that lets you make your own pieces to use in the game."
license = "Creative Commons Zero v1.0 Universal"
links = [
    { url = "https://github.com/tbsp/Adjustris", kind = "github" }
]
tags = ["Puzzle"]

[porklike]
title = "Porklike"
author = "Krystian Majewski"
description = "Enter the tower of Wurstlord. Can you make it to the top and steal his legendary Kielbasa? 9 floors of dangerous traps and enemies await you. Only if you move carefully and master your character's abilities will you become the champion of Porklike."
license = "MIT"
links = [
    { url = "https://binji.itch.io/porklikegb", kind = "itch" },
    { url = "https://github.com/binji/porklike.gb", kind = "github" }
]
tags = ["Roguelite"]

[shock_lobster]
title = "Shock Lobster"
author = "Dave VanEe"
description = "Venture forth on your quest as a lowly lobster imbued with magical powers, determined to inflict lethal damage to whatever stands in your way!"
license = "zlib License"
links = [
    { url = "https://tbsp.itch.io/shock-lobster", kind = "itch" },
    { url = "https://github.com/tbsp/shock-lobster", kind = "github" }
]
tags = ["Action"]

[sushi_nights]
title = "Sushi Nights"
author = "Zal0"
description = "Play as Hitsuji-kun, and use your trusty grappling hook to swing through buildings and alleys, locate the sushi, and deliver it to your targets."
license = "MIT"
links = [
    { url = "https://zalo.itch.io/sushi-nights", kind = "itch" },
    { url = "https://github.com/Zal0/SushiNights", kind = "github" }
]
tags = ["Platformer"]

[tobu]
title = "Tobu Tobu Girl"
author = "Tangram Games"
description = "Your cat is floating into the atmosphere and you are the only one who can save it. Jump, dash, and flap your arms to maneuver around perilous obstacles racing against the clock to retrieve your pet friend before it is too late!"
license = "Creative Commons Attribution v4.0 International"
links = [
    { url = "https://tangramgames.dk/tobutobugirl", kind = "official" },
    { url = "https://tangramgames.itch.io/tobutobugirl", kind = "itch" },
    { url = "https://github.com/SimonLarsen/tobutobugirl", kind = "github" }
]
tags = ["Platformer"]
[tobu_deluxe]
title = "Tobu Tobu Girl Deluxe"
author = "Tangram Games"
description = "Tobu Tobu Girl in full colour for the Game Boy Color, with Super Game Boy support. Dash and flap up through the sky after your runaway cat, bouncing off enemies to refill your energy."
license = "MIT License (code), Creative Commons Attribution v4.0 International (assets)"
links = [
    { url = "https://tangramgames.itch.io/tobu-tobu-girl-deluxe", kind = "itch" },
    { url = "https://github.com/SimonLarsen/tobutobugirl-dx", kind = "github" }
]
tags = ["Platformer"]

[ucity]
title = "µCity"
author = "Antonio Niño Díaz"
description = "An open-source city builder for the Game Boy Color. Zone land, lay roads and power lines, set taxes and save up to 16 cities."
license = "GPLv3+ (code), CC BY-SA 4.0 (graphics and music)"
links = [
    { url = "https://github.com/AntonioND/ucity", kind = "github" }
]
tags = ["Simulation"]

[libbet]
title = "Libbet and the Magic Floor"
author = "Damian Yerrick"
description = "Libbet, a boulder girl, rolls across a patterned floor in her basement, leaving tracks as she moves from shade to shade. Cover enough of the floor, then reach the exit, in this port of Martin Korth's Magic Floor."
license = "zlib License"
links = [
    { url = "https://github.com/pinobatch/libbet", kind = "github" }
]
tags = ["Puzzle"]

[dawn_will_come]
title = "Dawn Will Come"
author = "eishiya, H0lyhandgrenade and Kezia Salmon"
description = "Keep your survivors alive in endless darkness by setting each one to rest, guard or search every day until dawn comes. Contains death, gore and flashing lights."
license = "MIT License (code), CC BY 4.0 (artwork and music)"
links = [
    { url = "https://eishiya.itch.io/dawn-will-come", kind = "itch" },
    { url = "https://github.com/eishiya/DawnWillCome", kind = "github" }
]
tags = ["Adventure"]

[petris]
title = "Petris"
author = "bbbbbr"
description = "A falling-piece puzzle game of shapely pets. Build pets of different lengths from the pieces across five play types and five difficulties, from Easy to Beast. Two players can play against each other over the link cable."
license = "Creative Commons Attribution-NonCommercial-ShareAlike 4.0 International License"
links = [
    { url = "https://bbbbbr.itch.io/petris", kind = "itch" },
    { url = "https://github.com/bbbbbr/Petris", kind = "github" }
]
tags = ["Puzzle", "2-player link"]

[postie]
title = "Postie"
author = "invertedHat"
description = "A Celeste-inspired platformer made in seven days. Wall-jump and throw your ball up the tallest tower at the Castle of Ribe to become postie of the year."
