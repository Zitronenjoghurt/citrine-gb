[package]
name = "citrine-gb-app"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false

[features]
default = ["audio-codec"]
audio-codec = ["dep:rusty_aac", "dep:symphonia-codec-aac", "dep:symphonia-core"]
openh264-source = ["openh264/source"]

[package.metadata.docs.rs]
all-features = true
targets = ["aarch64-apple-darwin", "wasm32-unknown-unknown"]

[dependencies]
citrine-gb = { workspace = true, features = ["debug", "persistence", "recording", "base64", "brotli", "strum"] }
citrine-gb-gamedata = { workspace = true }
citrine-gb-net = { workspace = true }
citrine-gb-partner = { workspace = true }
anyhow = "1.0.102"
brotli = "8.0.2"
catppuccin-egui = { version = "5.7.0", default-features = false, features = ["egui33"] }
cpal = "0.17.3"
eframe = { version = "0.33.0", default-features = false, features = ["persistence"] }
egui = "0.33.0"
egui_commonmark = "0.22.0"
egui_dock = { version = "0.18.0", features = ["serde"] }
egui-phosphor = { version = "0.11.0", features = ["regular"] }
egui_plot = "0.34.1"
ewebsock = "0.8.0"
getrandom = "0.2.17"
image-webp = "0.2.4"
jiff = "0.2.20"
log = "0.4.29"
png = "0.18.1"
pollster = "0.4.0"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
qrcode = { version = "0.14.1", default-features = false }
rfd = "0.17.2"
resvg = { version = "0.49.0", default-features = false }
ringbuf = "0.4.8"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
strum = "0.28.0"
strum_macros = "0.28.0"
thiserror = "2.0.18"
web-time = "1.1.0"
zip = { version = "9.1.0", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = "3.6.1"
bzip2 = "0.6"
directories = "6.0"
discord-rich-presence = "1.1.0"
ewebsock = { version = "0.8.0", features = ["tls"] }
eframe = { version = "0.33.0", default-features = false, features = ["persistence", "wayland", "wgpu", "x11"] }
image = "0.25.9"
os_info = { version = "3", default-features = false }
openh264 = { version = "0.9.9", default-features = false, features = ["libloading"] }
rusty_aac = { version = "2.0.1", optional = true }
sha2 = "0.10.8"
symphonia-codec-aac = { version = "0.6.1", optional = true }
symphonia-core = { version = "0.6.1", optional = true }
ureq = { version = "3.1", default-features = false, features = ["rustls"] }
wgpu = { version = "27.0.1", features = ["metal", "vulkan", "dx12"] }

[target.'cfg(not(windows))'.dependencies]
gilrs = "0.11.1"

[target.'cfg(windows)'.dependencies]
sdl3-sys = { version = "0.7.2", default-features = false, features = ["build-from-source-static", "no-sdl-audio", "no-sdl-camera", "no-sdl-dialog", "no-sdl-gpu", "no-sdl-render", "no-sdl-tray"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
base64 = "0.22.1"
cpal = { version = "0.17.3", features = ["wasm-bindgen"] }
eframe = { version = "0.33.0", default-features = false, features = ["glow", "persistence"] }
jiff = { version = "0.2.20", features = ["js"] }
poll-promise = { version = "0.3.0", features = ["web"] }
wasm-bindgen-futures = "0.4.50"
js-sys = "0.3.70"
wasm-bindgen = "0.2.100"
web-sys = { version = "0.3.70", features = [
    "AudioContext",
    "AudioContextState",
    "AudioDestinationNode",
    "AudioNode",
    "AudioBuffer",
    "AudioParam",
    "AudioProcessingEvent",
    "AudioWorklet",
    "AudioWorkletNode",
    "AudioWorkletNodeOptions",
    "BaseAudioContext",
    "Blob",
    "BlobPropertyBag",
    "Document",
    "DomException",
    "DomStringList",
    "Element",
    "EventTarget",
    "GainNode",
    "History",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "IdbDatabase",
    "IdbFactory",
    "IdbObjectStore",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
    "MediaQueryList",
    "MessageEvent",
    "MessagePort",
    "Navigator",
    "ScriptProcessorNode",
    "Storage",
    "Url",
    "Window",
    "Worklet",
] }

[dev-dependencies]
citrine-gb-gamedata = { workspace = true, features = ["fixtures"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
citrine-gb-server = { workspace = true }
mp4 = "0.14.0"
openh264 = { version = "0.9.9", features = ["source"] }
tempfile = "3.23.0"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "time"] }

[build-dependencies]
brotli = "8.0.2"
proc-macro2 = "1.0.106"
quote = "1.0.44"
serde = { version = "1.0.228", features = ["derive"] }
sha1 = "0.11.0-rc.5"
sha2 = "0.11.0-rc.5"
toml = "1.0.3"
winresource = "0.1"

[package.metadata.winresource]
ProductName = "Citrine"
FileDescription = "A cycle-accurate Game Boy and Game Boy Color emulator"
LegalCopyright = "MIT licensed"
CompanyName = "Zitronenjoghurt"
OriginalFilename = "citrine.exe"
