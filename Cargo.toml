[workspace]
members = ["crates/*"]
exclude = ["vendor/dimpl", "fuzz"]
default-members = [
    "crates/citrine-gb",
    "crates/citrine-gb-app",
    "crates/citrine-gb-blip",
    "crates/citrine-gb-direct",
    "crates/citrine-gb-gamedata",
    "crates/citrine-gb-gameinfo",
    "crates/citrine-gb-net",
    "crates/citrine-gb-nds-files",
    "crates/citrine-gb-nds-net",
    "crates/citrine-gb-nds-sound",
    "crates/citrine-gb-pkm",
    "crates/citrine-gb-replay",
    "crates/citrine-gb-report",
    "crates/citrine-gb-partner",
    "crates/citrine-gb-server",
    "crates/citrine-gb-surface",
    "crates/citrine-gb-test-roms",
    "crates/citrine-gb-threads",
    "crates/citrine-gb-walker",
    "crates/citrine-gb-websocket",
]
resolver = "3"

[workspace.package]
version = "0.13.0"
edition = "2024"
license = "GPL-3.0-or-later"
homepage = "https://gb.lemon.industries"
repository = "https://github.com/Zitronenjoghurt/citrine-gb"

[workspace.dependencies]
citrine-gb = { path = "crates/citrine-gb" }
citrine-gb-achievements = { path = "crates/citrine-gb-achievements" }
citrine-gb-blip = { path = "crates/citrine-gb-blip", version = "0.13.0" }
citrine-gb-direct = { path = "crates/citrine-gb-direct" }
citrine-gb-gamedata = { path = "crates/citrine-gb-gamedata" }
citrine-gb-gameinfo = { path = "crates/citrine-gb-gameinfo" }
citrine-gb-net = { path = "crates/citrine-gb-net" }
citrine-gb-nds-files = { path = "crates/citrine-gb-nds-files" }
citrine-gb-nds-gpu = { path = "crates/citrine-gb-nds-gpu" }
citrine-gb-nds-sound = { path = "crates/citrine-gb-nds-sound" }
citrine-gb-partner = { path = "crates/citrine-gb-partner" }
citrine-gb-pkm = { path = "crates/citrine-gb-pkm" }
citrine-gb-replay = { path = "crates/citrine-gb-replay" }
citrine-gb-report = { path = "crates/citrine-gb-report", default-features = false }
citrine-gb-server = { path = "crates/citrine-gb-server" }
citrine-gb-surface = { path = "crates/citrine-gb-surface" }
citrine-gb-nds-net = { path = "crates/citrine-gb-nds-net" }
citrine-gb-walker = { path = "crates/citrine-gb-walker" }
citrine-gb-websocket = { path = "crates/citrine-gb-websocket" }
citrine-gb-threads = { path = "crates/citrine-gb-threads", version = "0.13.0" }
citrine-gb-test-roms = { path = "crates/citrine-gb-test-roms" }
melonds-sys = { path = "crates/melonds-sys" }
mgba-sys = { path = "crates/mgba-sys" }
rcheevos-sys = { path = "crates/rcheevos-sys" }
sameboy-sys = { path = "crates/sameboy-sys" }

[profile.dev.package.citrine-gb]
opt-level = 3

[profile.dev.package.citrine-gb-app]
opt-level = 3

[profile.dev.package.citrine-gb-nds-gpu]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.melonds-sys]
opt-level = 3

[profile.dev.package.mgba-sys]
opt-level = 3

[profile.dev.package.sameboy-sys]
opt-level = 3

[profile.release.build-override]
opt-level = 3

[profile.release.package.syn]
opt-level = 0

[profile.release.package.proc-macro2]
opt-level = 0

[profile.release.package.quote]
opt-level = 0

[profile.release.package.serde_derive]
opt-level = 0

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true

[profile.dist-android]
inherits = "dist"
strip = "debuginfo"

[patch.crates-io]
dimpl = { path = "vendor/dimpl" }
