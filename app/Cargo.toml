[package]
name = "citrine-gb-app"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false

[package.metadata.docs.rs]
all-features = true
targets = ["aarch64-apple-darwin", "wasm32-unknown-unknown"]

[dependencies]
citrine-gb = { workspace = true, features = ["debug", "persistence", "recording", "base64", "brotli", "strum"] }
anyhow = "1.0.102"
brotli = "8.0.2"
catppuccin-egui = { version = "5.7.0", default-features = false, features = ["egui33"] }
cpal = "0.17.3"
eframe = { version = "0.33.0", default-features = false, features = ["persistence"] }
egui = "0.33.0"
egui_commonmark = "0.22.0"
egui_dock = { version = "0.18.0", features = ["serde"] }
egui-notify = "0.21.0"
egui-phosphor = { version = "0.11.0", features = ["regular"] }
egui_plot = "0.34.1"
gilrs = "0.11.1"
log = "0.4.29"
pollster = "0.4.0"
rfd = "0.17.2"
ringbuf = "0.4.8"
serde = { version = "1.0.228", features = ["derive"] }
strum = "0.28.0"
strum_macros = "0.28.0"
web-time = "1.1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
directories = "6.0"
eframe = { version = "0.33.0", default-features = false, features = ["persistence", "wayland", "wgpu", "x11"] }
image = "0.25.9"
wgpu = { version = "27.0.1", features = ["metal", "vulkan", "dx12"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
base64 = "0.22.1"
cpal = { version = "0.17.3", features = ["wasm-bindgen"] }
eframe = { version = "0.33.0", default-features = false, features = ["glow", "persistence"] }
poll-promise = { version = "0.3.0", features = ["web"] }
wasm-bindgen-futures = "0.4.50"
js-sys = "0.3.70"
web-sys = { version = "0.3.70", features = ["Blob", "HtmlAnchorElement", "Url"] }

[build-dependencies]
brotli = "8.0.2"
proc-macro2 = "1.0.106"
quote = "1.0.44"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.0.3"
winresource = "0.1"

[package.metadata.bundle]
name = "Citrine"
identifier = "io.github.zitronenjoghurt.citrine"
short_description = "A cycle-accurate Game Boy and Game Boy Color emulator."
icon = ["assets/icon-512x512.icns"]

[package.metadata.winresource]